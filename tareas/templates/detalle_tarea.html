{% extends "base.html"%}

{% block content %}

<div class="container text-center justify-content-center">
    <form class='form-control' method="POST" action="{% url 'detalleTarea' tarea.id %}">
        {%csrf_token%} #para que no nos marque el error del servidor
        <div class="mb-3">
            <label for="" class="form-label">Name</label>
            <input
                type="text"
                class="form-control"
                name="titulo"
                id="Titulo"
                aria-describedby="helpId"
                value="{{tarea.Titulo}}"
                required
            />
        </div>
        <div class="mb-3">
            <label for="" class ="form-label">Deescripcion</label>
            <textarea class="form-control" name="descripcion"id="descripcion"  >{{tarea.descripcion}}</textarea>"
        <div/>
            <label for="" class="form-label">fecha</label>
            <input
                type="date"
                class="form-control"
                name="fecha"
                id="fecha"
                aria-describedby="helpId"
                value="{{tarea.fecha| date:'Y-m-d'}}"
                required
            />
<div/>
<div class="container">
    <input type="submit" class="btn btn-success" value="Cargar"/>
<div/>
{% endblock  %}
